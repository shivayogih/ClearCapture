minSdk = "26"
jdk = "17"
sdkVersion = "0.1.0"

# Toolchain
agp = "9.5.1"
kotlin = "2.4.21"
ksp = "2.3.13"
detekt = "1.23.8"
detektKotlin = "2.0.21"
foojay = "1.0.0"

# Libraries
composeBom = "2026.09.00"
camerax = "1.6.2"
