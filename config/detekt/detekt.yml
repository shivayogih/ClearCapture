# Shared detekt configuration. It builds on detekt's defaults; only deviations are listed.
complexity:
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 12
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  LongMethod:
    threshold: 80
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInFiles: 25
    thresholdInClasses: 20
    thresholdInInterfaces: 15
    thresholdInObjects: 20
  CyclomaticComplexMethod:
    threshold: 18
    ignoreSimpleWhenEntries: true

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

style:
  MagicNumber:
    active: false
  WildcardImport:
    active: true
    excludeImports: []
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ReturnCount:
    max: 4
    excludeGuardClauses: true
  ForbiddenComment:
    active: true
    comments:
      - value: 'FIXME:'
        reason: 'Fix it or open an issue and reference it.'
      - value: 'STOPSHIP:'
        reason: 'Must not be merged.'
  MaxLineLength:
    maxLineLength: 140
    excludes: ['**/test/**', '**/androidTest/**', '**/testFixtures/**']

potential-bugs:
  UnsafeCallOnNullableType:
    active: true
