version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns: ['androidx.*']
      kotlin:
        patterns: ['org.jetbrains.kotlin*', 'com.google.devtools.ksp']
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
